# Keeps the GitHub Actions this repo executes up to date.
#
# It exists to make pinning sustainable rather than to chase versions. The four
# jobs holding FLY_API_TOKEN pin superfly/flyctl-actions to a commit SHA (see
# ci.yml), and a pin with nobody watching it is a pin that rots into an
# unpatched dependency — Dependabot rewrites both the SHA and the trailing
# version comment when upstream publishes, which is the maintenance half of
# "don't run privileged CI off a mutable branch ref". The actions still on
# major tags come along for the ride, so `@v4` → `@v5` arrives as a PR instead
# of being noticed years later.
#
# Weekly, not daily: the whole surface is a handful of actions, and a PR per day
# is how a bot gets muted. npm dependencies are deliberately NOT watched here —
# this repo's lockfile churn is reviewed by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

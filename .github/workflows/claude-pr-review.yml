name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened]
  #
  # NOTE ON RE-RUNNING A FAILED REVIEW. There is deliberately no
  # workflow_dispatch here: it was tried (run #69) and is a trap. The action
  # takes its PR context from the event payload, so under a dispatch PR_NUMBER
  # is empty, the review silently does nothing — and the job still reports
  # SUCCESS in ~15s, which is worse than failing, because the check goes green
  # having reviewed nothing.
  #
  # `issue_comment` (say @claude on the PR) is the action's own supported
  # re-trigger and would work, but note that non-`pull_request` events run the
  # workflow file from the DEFAULT branch — so the settings below only apply
  # once they are merged to main, not while they sit on a feature branch.
  # Until then the only retrigger that picks up this file is reopening the PR,
  # which costs a preview teardown (see pr-preview-teardown.yml).

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Billed against the connected Claude Pro/Max/Team/Enterprise subscription
          # instead of metered API usage. Generate with `claude setup-token` and store
          # the result as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          #
          # To refresh (the token is valid for one year):
          #   1. Run `claude setup-token` locally and log in when the browser opens.
          #   2. Copy the printed token.
          #   3. Go to https://github.com/brannondorsey/nickel-bridge/settings/secrets/actions
          #      and update the CLAUDE_CODE_OAUTH_TOKEN secret with the new value.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request in the brannondorsey/nickel-bridge repo.

            Read the repo's CLAUDE.md (checked in at the repo root) for context, and pay
            particular attention to its "Invariants — do not break" section — e.g. robot
            determinism (the packages/ai + server/src/game.ts bidding/play pipeline must
            stay a pure function of tournament seed/board/difficulty), packages/ai/src/
            encode.ts being a bit-for-bit port that must not be refactored for style, new
            SAYC conventions needing a spec-table row in packages/core/test/sayc.test.ts,
            and packages/core staying dependency-free and I/O-free.

            Focus on correctness bugs, security issues, and violations of those invariants
            introduced by this diff. Also flag anything that contradicts other guidance in
            CLAUDE.md (env var handling, DEV_AUTH/DEMO never on production, etc).

            Hunt for bugs specifically: edge cases the diff doesn't handle, off-by-one or
            state-management errors, race conditions, and logic that looks correct but
            doesn't match how the surrounding code actually behaves — cite file:line and the
            concrete input/state that would trigger each one.

            Also validate the PR against its own stated goals: read the PR title and
            description, then check whether the diff actually accomplishes what it claims.
            Call out any gaps — claimed behavior the code doesn't implement, edge cases the
            description ignores, or scope that silently expanded or shrank versus what was
            described.

            Post a single top-level PR comment summarizing what you found (or a short note
            if nothing stood out). Do not approve or request changes on the PR — just comment.
          # bypassPermissions: an allowlist of just gh pr view/diff/comment worked but was
          # cramped -- any other command (git log, npm test, etc.) still hit the same
          # interactive-approval wall that has no one to approve it in CI. Accepted here
          # because every PR today is self-authored (brannondorsey); revisit before this
          # repo takes outside contributions, since it lets a crafted PR description/diff
          # try to steer the agent with no tool gate at all.
          # 50 turns was not enough: the review of #122 spent all 50 reading the
          # diff and hit `error_max_turns` at turn 51 without ever reaching the
          # step that posts the comment — a full run's cost for no output. The
          # limit exists to bound a runaway loop, not to bound a thorough read,
          # so it is set well clear of what a large PR actually needs.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 75
            --permission-mode bypassPermissions
          # TEMPORARY debug flag: two consecutive reopen-retriggers of #136 (runs
          # 30962729887, 30963718431) reported clean success/is_error:false but posted
          # no PR comment of any kind. This flag surfaces the full turn-by-turn
          # transcript so we can see what the agent actually did. Revert once diagnosed.
          show_full_output: true

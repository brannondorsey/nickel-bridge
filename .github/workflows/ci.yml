name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # Derives the Cloudflare edge config from server/src/seo.ts and asserts its
      # invariants — chiefly that nothing session-scoped can land in the cache set.
      # No token needed, so it runs on every PR: a route-table edit that would cache
      # /api fails here rather than at the edge.
      - run: node scripts/cloudflare.mjs --plan

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nickel-bridge:ci .

  # Deploys a throwaway Fly.io app per open PR (nickel-bridge-pr-<number>) so a change can be
  # reviewed live at a URL instead of run locally. Uses DEV_AUTH (name-only login) instead of
  # Google OAuth, since OAuth needs a pre-registered redirect URI and preview URLs are per-PR.
  # Never enable DEV_AUTH on the production app (see .claude/CLAUDE.md invariant #5); the
  # permanent demo app (deploy-demo below) intentionally shares this DEV_AUTH+DEMO shape.
  # Torn down by pr-preview-teardown.yml when the PR closes.
  deploy-preview:
    needs: [test, e2e, docker]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: nickel-bridge-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit, not `@master`, in all four jobs that hold FLY_API_TOKEN (the
      # three deploys here plus pr-preview-teardown.yml). A branch ref re-resolves on every
      # run, so whatever sits on that branch at the moment a deploy starts executes with a
      # token that can deploy arbitrary images, read the SQLite volume, or destroy the app —
      # and unlike a release tag, a branch moves with every upstream commit rather than a
      # deliberate publish. The other actions here stay on their major tags: they are
      # GitHub's own or non-privileged, and .github/dependabot.yml now watches all of them,
      # including this pin (it rewrites the SHA and the comment on each upstream release).
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master as of 2026-08-02
      # The `github.event.action != 'closed'` guard above was evaluated before test/e2e/
      # docker ran, which is minutes ago — the PR may well have merged since. Creating the
      # app now would hand pr-preview-teardown.yml an app that did not exist when it ran,
      # which is how three previews were orphaned in July 2026. Re-ask right before
      # creating anything; teardown's watch loop covers the residual seconds.
      - name: Skip if the PR closed while CI was running
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh pr view "${{ github.event.pull_request.number }}" \
                    --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          [ "$state" = "OPEN" ] || echo "PR is $state — skipping preview deploy."
      - name: Ensure preview app + volume exist
        if: steps.pr.outputs.state == 'OPEN'
        run: |
          flyctl apps create "$APP" --org personal || true
          count=$(flyctl volumes list --app "$APP" --json 2>/dev/null | jq 'length' 2>/dev/null)
          count=${count:-0}
          if [ "$count" -eq 0 ]; then
            flyctl volumes create data --app "$APP" --region ewr --size 1 --yes
          fi
          flyctl secrets set DEV_AUTH=1 DEMO=1 BASE_URL="https://$APP.fly.dev" --app "$APP"
      - name: Deploy preview
        if: steps.pr.outputs.state == 'OPEN'
        run: flyctl deploy --app "$APP" --config fly.toml --remote-only --ha=false
      - name: Comment preview URL on the PR
        if: steps.pr.outputs.state == 'OPEN'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-url
          message: |
            🚀 Preview deployed: https://${{ env.APP }}.fly.dev

            **Demo tour:** https://${{ env.APP }}.fly.dev/demo — opens the scenario gallery already signed in as Inspector; jump straight into prepared game states for click-testing.

            Or log in with any name — dev auth is enabled on preview apps only, no Google account needed.

  # Keeps the single permanent demo instance (nickel-bridge-demo, demo-bridge.brannon.online)
  # in lockstep with production code on every push to main. Same DEMO/DEV_AUTH shape as PR
  # previews — it is deliberately NOT production, so invariant 5 (which is scoped to the
  # production app) does not apply here. Unlike previews it never gets torn down: it's a
  # stable URL for automation and human click-testers. Self-provisioning and idempotent,
  # except the one-time cert + DNS setup documented in README.md "Deployment".
  deploy-demo:
    needs: [test, e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-demo
      cancel-in-progress: true
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: nickel-bridge-demo
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master as of 2026-08-02
      - name: Ensure demo app + volume exist
        run: |
          flyctl apps create "$APP" --org personal || true
          count=$(flyctl volumes list --app "$APP" --json 2>/dev/null | jq 'length' 2>/dev/null)
          count=${count:-0}
          if [ "$count" -eq 0 ]; then
            flyctl volumes create data --app "$APP" --region ewr --size 1 --yes
          fi
          flyctl secrets set DEV_AUTH=1 DEMO=1 BASE_URL="https://demo-bridge.brannon.online" --app "$APP"
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
      # Must run BEFORE the deploy: it records what the origin serves now, so the purge can
      # tell what this deploy actually changed. Costs at most one wake, and usually not even
      # that — the deploy immediately after would have woken the machine anyway.
      - name: Snapshot origin before deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/cloudflare.mjs --snapshot --host=demo-bridge.brannon.online --out=/tmp/cf-before.json
      - name: Deploy demo
        run: flyctl deploy --app "$APP" --config fly.toml --remote-only --ha=false
      # `--apply` deliberately does NOT run here: the ruleset is zone-wide, exactly one job
      # may write it, and deploy-production owns it now that production is fronted too. This
      # job purges only its own host, because the two apps deploy independently and dropping
      # the other one's pages would discard good cache entries.
      - name: Purge the demo app's cached pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/cloudflare.mjs --purge --host=demo-bridge.brannon.online --since=/tmp/cf-before.json

  # Auto-deploys every merge to main. Assumes the production Fly app/volume/secrets already
  # exist (see README.md "Deployment" — one-time manual setup, not done by this workflow).
  deploy-production:
    needs: [test, e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Job-level so the steps below can gate on it: the `env` context in a step's own
      # `if:` does not see env declared on that same step.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master as of 2026-08-02
      # Enforce CLAUDE.md invariant 5: DEV_AUTH (unauthenticated login) and
      # DEMO (auto-login + data reset) must never reach production. Fails the
      # deploy if either secret is set on the production app.
      - name: Refuse to deploy with demo/dev secrets set
        # Fail CLOSED: capturing into a variable makes a flyctl failure fail
        # the step (default shell is bash -e), instead of a broken listing
        # reading as "no forbidden secrets" and waving the deploy through.
        run: |
          secrets=$(flyctl secrets list --app nickel-bridge)
          if echo "$secrets" | grep -qE '^\s*(DEV_AUTH|DEMO)\s'; then
            echo "::error::DEV_AUTH/DEMO secret found on the production app — remove it before deploying"
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
      # Must run BEFORE the deploy — see the same step in deploy-demo for why.
      - name: Snapshot origin before deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/cloudflare.mjs --snapshot --host=bridge.brannon.online --out=/tmp/cf-before.json
      - run: flyctl deploy --app nickel-bridge --config fly.toml --remote-only --ha=false
      # This job owns `--apply`: the ruleset is zone-wide, so exactly one job may write it,
      # and production is the natural owner now that it is fronted too. deploy-demo keeps
      # only its own scoped purge. Purging is `--host`-scoped because the two apps deploy
      # independently, and dropping the other one's pages would discard good cache entries.
      - name: Reconcile Cloudflare edge config
        id: cf_apply
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: node scripts/cloudflare.mjs --apply
      # Purge even when --apply refused: that case means the zone holds a rule this script
      # does not own, which needs a human — not a reason to also strand the HTML this deploy
      # just changed behind a 30-day edge TTL. The two concerns are independent.
      - name: Purge production's cached pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/cloudflare.mjs --purge --host=bridge.brannon.online --since=/tmp/cf-before.json
      - name: Fail the deploy if the edge config could not be reconciled
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.cf_apply.outcome == 'failure'
        run: |
          echo "::error::cloudflare --apply failed (see the Reconcile step). The purge still ran."
          exit 1

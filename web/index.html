<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#fcfbf8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      seo:start — everything between these two markers is the SITE-WIDE
      discoverability block, and web/scripts/prerender-glossary.mjs replaces the
      whole span wholesale when it prerenders a glossary page. Keep the markers
      exactly as they are, and keep anything page-independent (charset,
      viewport, icon, the theme script) OUTSIDE them.

      This is the SPA shell, served for EVERY route that isn't a prerendered
      file, so everything in here has to be true of the site as a whole rather
      than of one page. Two consequences worth keeping:

      - No <link rel="canonical">. A static canonical pointing at the site root
        would tell crawlers that /glossary/finesse "is really" the home page and
        actively suppress the very pages we want indexed. Prerendered glossary
        pages (web/scripts/prerender-glossary.mjs) carry their own correct
        self-canonical instead; everything else self-canonicalizes by default.
      - The description is plain and keyword-bearing on purpose. It is never
        rendered to a visitor — the on-screen splash keeps its own voice — so it
        can say what the app is without touching the experience.

      The demo app and PR previews serve this same shell; they're kept out of
      the index by an X-Robots-Tag header + robots.txt, not by anything here
      (see the noindex block in server/src/app.ts).
    -->
    <title>Nickel Bridge — learn &amp; play duplicate bridge</title>
    <meta
      name="description"
      content="Play duplicate bridge free in your browser — SAYC bidding with instant feedback on every call, matchpoint scoring, and a tournament always open."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nickel Bridge" />
    <meta property="og:title" content="Nickel Bridge — learn &amp; play duplicate bridge" />
    <meta
      property="og:description"
      content="Play duplicate bridge free in your browser — SAYC bidding with instant feedback on every call, matchpoint scoring, and a tournament always open."
    />
    <meta property="og:url" content="https://bridge.brannon.online/" />
    <meta property="og:image" content="https://bridge.brannon.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nickel Bridge — duplicate · SAYC" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nickel Bridge — learn &amp; play duplicate bridge" />
    <meta
      name="twitter:description"
      content="Play duplicate bridge free in your browser — SAYC bidding with instant feedback on every call, matchpoint scoring, and a tournament always open."
    />
    <meta name="twitter:image" content="https://bridge.brannon.online/og-image.png" />
    <!--
      Structured data for the app itself. Describes the site rather than any one
      route, which is what makes it safe on a shell served for every path; the
      prerendered glossary pages replace it with their own DefinedTerm node.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Nickel Bridge",
        "url": "https://bridge.brannon.online/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (modern web browser)",
        "description": "Play duplicate bridge free in your browser — SAYC bidding with instant feedback on every call, matchpoint scoring, and a tournament always open.",
        "image": "https://bridge.brannon.online/og-image.png",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- seo:end -->
    <!--
      Night mode: apply the persisted theme.ts preference before first paint, so
      there's no light-mode flash for a Night/Adaptive/System-into-dark-OS visitor.
      Plain, blocking (non-module) JS because this must run before the deferred module
      script graph (main.tsx, theme.ts) loads — see theme.ts for the same logic
      (including the ADAPTIVE_NIGHT_START_HOUR/_END_HOUR constants) in the form the
      rest of the app uses. Keep the two in sync.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('nb:theme');
          if (pref !== 'day' && pref !== 'night' && pref !== 'adaptive') pref = 'system';
          var hour = new Date().getHours();
          var isNight =
            pref === 'night' ||
            (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
            (pref === 'adaptive' && (hour >= 21 || hour < 7));
          if (pref !== 'system') {
            document.documentElement.setAttribute('data-theme', isNight ? 'night' : 'light');
          }
          if (isNight) {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#171512');
          }
        } catch (e) {
          /* ignore — worst case is a light-mode flash */
        }
      })();
    </script>
    <!--
      Suit color palette: apply the persisted suitPalette.ts preference before
      first paint, orthogonal to the theme script above (its own attribute, its
      own try/catch — a failure in one must not block the other). Plain, blocking
      JS for the same reason as the theme script: this must run before the
      deferred module script graph loads. Keep in sync with suitPalette.ts by hand.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('nb:suitPalette') === 'colorblind') {
            document.documentElement.setAttribute('data-suit-palette', 'colorblind');
          }
        } catch (e) {
          /* ignore — worst case is the standard palette on first paint */
        }
      })();
    </script>
    <!--
      The prerendered fallback is for agents that CAN'T run JavaScript, and this
      marks the documents that can. server/src/app.ts answers GET / with
      web/dist/home-static/index.html, whose #root already holds a plain-prose
      copy of the landing page (web/scripts/prerender.mjs) — and React throws
      that away the moment it mounts. For a signed-out visitor arriving from
      search that swap is roughly the same words twice, so it reads as the page
      finishing; for a signed-in player refreshing the lobby it is a flash of a
      different screen entirely, the pitch they already accepted.

      So: if this browser has ever held a signed-in session — splash.ts stamps
      nb:lastVisit on every authenticated mount — the prerendered pages hide
      their own fallback markup under this attribute (the .pr rule in
      prerender.mjs). A player then gets the same blank-then-Loading every other
      route in the app already gives them, and a search arrival keeps the fast
      static paint.

      Deliberately decided on the client. The server knows exactly who is signed
      in, but varying GET / on the session cookie would put a per-visitor answer
      behind an edge cache keyed without it (scripts/cloudflare.mjs) — a
      heuristic that costs one plain paint when it guesses wrong beats a cached
      page that is wrong for everyone. Nothing clears the stamp on sign-out for
      the same reason: a false positive costs that paint and nothing else.

      Plain, blocking JS with its own try/catch, like the two scripts above.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('nb:lastVisit')) {
            document.documentElement.setAttribute('data-returning-player', '1');
          }
        } catch (e) {
          /* ignore — worst case is the prerendered fallback flashing once */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
